name: Build Universal Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional version name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          if [[ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "sdkmanager not found under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ github.event.inputs.version_name }}"
          fi
          VER="${VER:-1.0.0}"
          echo "version_name=${VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER:-1}" >> "$GITHUB_OUTPUT"

      - name: Run Android unit tests
        working-directory: android-shell
        run: gradle testDebugUnitTest --no-daemon

      - name: Decode release keystore if configured
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Universal APK
        working-directory: android-shell
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.has_signing == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SCROLLLENS_DEFAULT_SERVER_URL: ${{ secrets.SCROLLLENS_DEFAULT_SERVER_URL }}
          SCROLLLENS_DEFAULT_SERVER_NAME: ${{ secrets.SCROLLLENS_DEFAULT_SERVER_NAME }}
        run: |
          if [[ "${{ steps.signing.outputs.has_signing }}" == "true" ]]; then
            gradle assembleRelease -PversionName="${{ steps.meta.outputs.version_name }}" -PversionCode="${{ steps.meta.outputs.version_code }}" --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "${GITHUB_WORKSPACE}/ScrollLens-${{ steps.meta.outputs.version_name }}-universal.apk"
          else
            gradle assembleDebug -PversionName="${{ steps.meta.outputs.version_name }}" -PversionCode="${{ steps.meta.outputs.version_code }}" --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "${GITHUB_WORKSPACE}/ScrollLens-${{ steps.meta.outputs.version_name }}-universal.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollLens-universal-apk
          path: ScrollLens-*-universal.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ScrollLens-*-universal.apk
          generate_release_notes: true
