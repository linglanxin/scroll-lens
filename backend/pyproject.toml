[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scroll-lens-backend"
version = "0.1.0"
description = "ScrollLens (卷镜) lightweight multi-user AI reading & document Q&A backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "httpx>=0.27,<1.0",
    "PyJWT>=2.9,<3.0",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "python-multipart>=0.0.9",
    "jieba>=0.42.1",
    "PyMuPDF>=1.24.0",
    "python-pptx>=1.0.0",
    "Pillow>=10.0",
    "python-docx>=1.1.2",
    "ebooklib>=0.18",
    "mobi>=0.4.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
